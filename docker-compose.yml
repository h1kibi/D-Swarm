# dswarm — unified containerized deployment (P2-v3).
#
# One command brings up the whole control plane:
#   DSWARM_HOST_DATA_ROOT=/opt/dswarm/data DSWARM_WEB_PASSWORD=... \
#     docker compose up --build
#
# Topology:
#   web-api  — FastAPI coordinator. Mounts the host docker socket and launches
#              WORKER containers as SIBLINGS on the host daemon (not dind). The
#              in-container supervisor dials back to web-api:9100 over dswarm_net.
#   ui       — Next command deck; proxies /api → web-api.
#   (workers are NOT a compose service — web-api `docker run`s them per-run.)
#
# The four P2-v3 BLOCKERs are addressed by the env + mounts here:
#   a) DSWARM_CONTROL_BIND=0.0.0.0 — receiver reachable by sibling workers.
#   b) DSWARM_WORKER_NETWORK=dswarm_net + DSWARM_CONTROL_HOST=web-api — workers
#      join this network and resolve the receiver by the web-api alias.
#   c) ${DSWARM_HOST_DATA_ROOT} bind-mounted at the SAME path in web-api, and
#      DSWARM_SESSIONS_ROOT under it, so worker sibling mounts (resolved by the
#      HOST daemon) point at real host paths. _mount_source() is identity here.
#   d) DSWARM_IN_CONTAINER=1 — the swarm hard-fails instead of falling back to a
#      host-native local worker.

name: dswarm

networks:
  dswarm_net:
    # fixed external-style name → workers join by name; overridable for multiple
    # deployments on one host.
    name: ${DSWARM_WORKER_NETWORK:-dswarm_net}

services:
  board:
    image: pgvector/pgvector:pg17
    networks: [dswarm_net]
    environment:
      POSTGRES_USER: "${DSWARM_BOARD_PGUSER:-dswarm}"
      POSTGRES_PASSWORD: "${DSWARM_BOARD_PGPASSWORD:-dswarm}"
      POSTGRES_DB: "${DSWARM_BOARD_PGDATABASE:-dswarm}"
    volumes:
      - dswarm_board_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DSWARM_BOARD_PGUSER:-dswarm} -d ${DSWARM_BOARD_PGDATABASE:-dswarm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web-api:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: dswarm-web:latest
    networks: [dswarm_net]
    ports:
      - "${DSWARM_WEB_PUBLISH_HOST:-127.0.0.1}:${DSWARM_WEB_PORT:-8000}:8000"
    volumes:
      # talk to the HOST docker daemon (launch worker sibling containers)
      - /var/run/docker.sock:/var/run/docker.sock
      # mirror the host data root at the SAME path so worker mounts resolve on host
      - ${DSWARM_HOST_DATA_ROOT:?set DSWARM_HOST_DATA_ROOT to an absolute host path}:${DSWARM_HOST_DATA_ROOT}
    environment:
      DSWARM_IN_CONTAINER: "1"
      DSWARM_RUNTIME_MODE: "docker"
      DSWARM_CONTROL_BIND: "0.0.0.0"
      DSWARM_CONTROL_HOST: "web-api"
      DSWARM_WORKER_NETWORK: "${DSWARM_WORKER_NETWORK:-dswarm_net}"
      DSWARM_HOST_DATA_ROOT: "${DSWARM_HOST_DATA_ROOT}"
      # container data root == host root (identity mirror), so _mount_source is a no-op
      DSWARM_CONTAINER_DATA_ROOT: "${DSWARM_HOST_DATA_ROOT}"
      DSWARM_SESSIONS_ROOT: "${DSWARM_HOST_DATA_ROOT}/sessions"
      # Uvicorn listens on 0.0.0.0 inside the container; auth follows the
      # host-side published address so loopback-only use can stay passwordless.
      DSWARM_WEB_BIND: "${DSWARM_WEB_PUBLISH_HOST:-127.0.0.1}"
      DSWARM_WEB_PASSWORD: "${DSWARM_WEB_PASSWORD:-}"
      DSWARM_WORKER_IMAGE: "${DSWARM_WORKER_IMAGE:-ghcr.io/h1kibi/dswarm-worker-pi:0.3.0-rc.1}"
      DSWARM_WORKER_IMAGE_VERSION: "${DSWARM_WORKER_IMAGE_VERSION:-}"
      # The coordinator brain (planner) + auto-titler use LLMClient, which reads
      # the key from the process env. .env is .dockerignore'd (secrets must NOT be
      # baked into the image), so it can only reach the container via compose.
      # Without it LLMClient sends "Authorization: Bearer " (empty) and httpx
      # rejects it ("Illegal header value"). Pass it through from the host .env.
      DSWARM_DEEPSEEK_API_KEY: "${DSWARM_DEEPSEEK_API_KEY:-}"
      DSWARM_DEEPSEEK_BASE_URL: "${DSWARM_DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}"
      DSWARM_LLM_TRUST_ENV: "${DSWARM_LLM_TRUST_ENV:-0}"
      DSWARM_BOARD_DSN: "postgresql://${DSWARM_BOARD_PGUSER:-dswarm}:${DSWARM_BOARD_PGPASSWORD:-dswarm}@board:5432/${DSWARM_BOARD_PGDATABASE:-dswarm}"
    depends_on:
      board:
        condition: service_healthy
    restart: unless-stopped

  tui-control:
    build:
      context: .
      dockerfile: docker/tui/Dockerfile
    image: dswarm-tui:latest
    stdin_open: true
    tty: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DSWARM_HOST_DATA_ROOT:?set DSWARM_HOST_DATA_ROOT to an absolute host path}:${DSWARM_HOST_DATA_ROOT}
    environment:
      DSWARM_IN_CONTAINER: "1"
      DSWARM_RUNTIME_MODE: "docker"
      DSWARM_CONTROL_BIND: "0.0.0.0"
      DSWARM_CONTROL_HOST: "tui-control"
      DSWARM_WORKER_NETWORK: "${DSWARM_WORKER_NETWORK:-dswarm_net}"
      DSWARM_HOST_DATA_ROOT: "${DSWARM_HOST_DATA_ROOT}"
      DSWARM_CONTAINER_DATA_ROOT: "${DSWARM_HOST_DATA_ROOT}"
      DSWARM_SESSIONS_ROOT: "${DSWARM_HOST_DATA_ROOT}/sessions"
      DSWARM_MODEL_GATEWAY_BIND: "0.0.0.0"
      DSWARM_GATEWAY_URL: "http://tui-control:9101/v1"
      DSWARM_WORKER_IMAGE: "${DSWARM_WORKER_IMAGE:-ghcr.io/h1kibi/dswarm-worker-pi:0.3.0-rc.1}"
      DSWARM_WORKER_IMAGE_VERSION: "${DSWARM_WORKER_IMAGE_VERSION:-}"
      DSWARM_DEEPSEEK_API_KEY: "${DSWARM_DEEPSEEK_API_KEY:-}"
      DSWARM_DEEPSEEK_BASE_URL: "${DSWARM_DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}"
      DSWARM_LLM_TRUST_ENV: "${DSWARM_LLM_TRUST_ENV:-0}"
    networks: [dswarm_net]

  ui:
    build:
      context: ./apps/web/ui
      dockerfile: ../../../docker/ui/Dockerfile
      args:
        # Next standalone freezes the rewrites() proxy target at BUILD time, so the
        # backend alias must be passed as a build arg (not just a runtime env).
        DSWARM_BACKEND: "http://web-api:8000"
    image: dswarm-ui:latest
    networks: [dswarm_net]
    ports:
      # host port overridable (a dev server may already own 3001); container stays 3001
      - "${DSWARM_WEB_PUBLISH_HOST:-127.0.0.1}:${DSWARM_UI_PORT:-3001}:3001"
    environment:
      DSWARM_BACKEND: "http://web-api:8000"   # kept for parity; baked at build (see args)
    depends_on: [web-api]
    restart: unless-stopped

volumes:
  dswarm_board_data:
