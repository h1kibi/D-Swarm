name: release-images

# Build the dswarm control-plane and worker images and push them to GitHub
# Container Registry (GHCR).
#
# Images (all under ghcr.io/<owner>/...):
#   dswarm-web            — FastAPI control plane        (docker/web/Dockerfile,  context = repo root)
#   dswarm-ui             — Next command deck            (docker/ui/Dockerfile,   context = apps/web/ui)
#   dswarm-worker-slim    — ubuntu base + CLI + agent    (docker/worker-slim,     needs cross-compiled runtime_agent)
#   dswarm-worker-pi      — all-in-one Kali pi worker    (docker/worker-kali/base/Dockerfile, context = repo root)
#
# Auth: the built-in GITHUB_TOKEN with packages:write — no PAT, no Docker Hub.
# Triggers:
#   - release published  → tag images with the release tag (e.g. v0.0.1); latest only for stable releases
#   - workflow_dispatch  → manual run for testing the pipeline inside the private repo
#                          (optionally skip the slow Kali pi worker via the input)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_worker_pi:
        description: "Also build the heavy Kali dswarm-worker-pi image"
        type: boolean
        default: true
      prerelease:
        description: "Treat this manual run as a pre-release (skip latest tags)"
        type: boolean
        default: false
      tag:
        description: "Image tag to push (defaults to the git ref name)"
        type: string
        default: ""

# Least-privilege: read the code, write packages (GHCR).
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  GO_VERSION: "1.26"

jobs:
  # ── lightweight images: plain docker build-push ───────────────────────────────
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          # strip a leading refs/tags/ if present and fall back to a sane default
          TAG="${TAG#refs/tags/}"
          [ -z "$TAG" ] && TAG="latest"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          PRERELEASE="false"
          if [ "$EVENT_NAME" = "release" ] && [ "$RELEASE_PRERELEASE" = "true" ]; then
            PRERELEASE="true"
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_PRERELEASE" = "true" ]; then
            PRERELEASE="true"
          fi
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved image namespace: $OWNER"
          echo "Resolved tag: $TAG"
          echo "Pre-release: $PRERELEASE"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push dswarm-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/dswarm-web:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=dswarm-web
          cache-to: type=gha,scope=dswarm-web,mode=max

      - name: Push latest alias (stable releases only)
        if: steps.tag.outputs.prerelease != 'true'
        run: |
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/dswarm-web:latest" \
            "${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/dswarm-web:${{ steps.tag.outputs.tag }}"

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          TAG="${TAG#refs/tags/}"
          [ -z "$TAG" ] && TAG="latest"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          PRERELEASE="false"
          if [ "$EVENT_NAME" = "release" ] && [ "$RELEASE_PRERELEASE" = "true" ]; then
            PRERELEASE="true"
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_PRERELEASE" = "true" ]; then
            PRERELEASE="true"
          fi
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Pre-release: $PRERELEASE"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push dswarm-ui
        uses: docker/build-push-action@v6
        with:
          context: apps/web/ui
          file: docker/ui/Dockerfile
          push: true
          # The Next standalone server freezes the /api proxy target at build time.
          # Bake the compose service alias so the composed stack works out of the box;
          # a non-compose deployment overrides NEXT/DSWARM_BACKEND at its own build.
          build-args: |
            DSWARM_BACKEND=http://web-api:8000
          tags: |
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/dswarm-ui:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=dswarm-ui
          cache-to: type=gha,scope=dswarm-ui,mode=max

      - name: Push latest alias (stable releases only)
        if: steps.tag.outputs.prerelease != 'true'
        run: |
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/dswarm-ui:latest" \
            "${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/dswarm-ui:${{ steps.tag.outputs.tag }}"

  # ── worker images: cross-compile the Go runtime_agent, stage context, build ───
  worker-slim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          TAG="${TAG#refs/tags/}"
          [ -z "$TAG" ] && TAG="latest"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          PRERELEASE="false"
          if [ "$EVENT_NAME" = "release" ] && [ "$RELEASE_PRERELEASE" = "true" ]; then
            PRERELEASE="true"
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_PRERELEASE" = "true" ]; then
            PRERELEASE="true"
          fi
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Pre-release: $PRERELEASE"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # the runtime-agent module has no external deps (no go.sum), so the module
          # cache has nothing to restore — disable it to skip the "go.sum not found" warning
          cache: false

      - name: Stage build context (cross-compile runtime_agent + copy skill files)
        run: |
          set -euo pipefail
          ctx=docker/worker-slim
          echo ">> cross-compiling runtime_agent (linux/amd64, static)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -C cmd/runtime-agent -trimpath -ldflags="-s -w" \
              -o "$GITHUB_WORKSPACE/$ctx/runtime_agent" .
          file "$ctx/runtime_agent" || true
          echo ">> staging AGENTS.md + blackboard skill"
          cp docker/worker/AGENTS.md "$ctx/AGENTS.md"
          cp skills/dswarm-blackboard/SKILL.md "$ctx/blackboard.SKILL.md"
          cp skills/dswarm-blackboard/blackboard.py "$ctx/blackboard.py"
          chmod +x "$ctx/blackboard.py"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push dswarm-worker-slim
        uses: docker/build-push-action@v6
        with:
          context: docker/worker-slim
          file: docker/worker-slim/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/dswarm-worker-slim:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=dswarm-worker-slim
          cache-to: type=gha,scope=dswarm-worker-slim,mode=max

      - name: Push latest alias (stable releases only)
        if: steps.tag.outputs.prerelease != 'true'
        run: |
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/dswarm-worker-slim:latest" \
            "${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/dswarm-worker-slim:${{ steps.tag.outputs.tag }}"

  worker-pi:
    runs-on: ubuntu-latest
    # The all-in-one Kali pi image is large; skip it on a manual run when the
    # operator unchecks the input, always build on a real release.
    if: ${{ github.event_name == 'release' || github.event.inputs.build_worker_pi == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        # The default runner has ~14G free; the Kali build needs more. Drop the big
        # preinstalled toolchains we don't use so the build doesn't ENOSPC.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          TAG="${TAG#refs/tags/}"
          [ -z "$TAG" ] && TAG="latest"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          PRERELEASE="false"
          if [ "$EVENT_NAME" = "release" ] && [ "$RELEASE_PRERELEASE" = "true" ]; then
            PRERELEASE="true"
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_PRERELEASE" = "true" ]; then
            PRERELEASE="true"
          fi
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Pre-release: $PRERELEASE"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # the runtime-agent module has no external deps (no go.sum), so the module
          # cache has nothing to restore — disable it to skip the "go.sum not found" warning
          cache: false

      - name: Stage build context (cross-compile runtime_agent + copy skill files)
        run: |
          set -euo pipefail
          ctx=docker/worker-kali
          echo ">> cross-compiling runtime_agent (linux/amd64, static)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -C cmd/runtime-agent -trimpath -ldflags="-s -w" \
              -o "$GITHUB_WORKSPACE/$ctx/runtime_agent" .
          file "$ctx/runtime_agent" || true
          echo ">> worker-kali build context staged (pi-config + skills copied at build)"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push dswarm-worker-pi (Kali)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker-kali/base/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/dswarm-worker-pi:${{ steps.tag.outputs.tag }}
          # GHA cache has a 10G/repo cap; the Kali image alone can exceed it, so use a
          # registry-side cache image instead (does not count against the GHA cache).
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/dswarm-worker-pi:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/dswarm-worker-pi:buildcache,mode=max

      - name: Push latest alias (stable releases only)
        if: steps.tag.outputs.prerelease != 'true'
        run: |
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/dswarm-worker-pi:latest" \
            "${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/dswarm-worker-pi:${{ steps.tag.outputs.tag }}"
