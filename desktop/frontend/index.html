<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>D-Swarm</title>
  <!-- wails runtime + bindings (present in production builds) — lets the page
       ask the Go side for the real UI port instead of assuming :3001. -->
  <script src="/wailsjs/runtime/runtime.js"></script>
  <script src="/wailsjs/go/main/App.js"></script>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0b1220; color: #e6eef6; font-family: system-ui, sans-serif;
           display: flex; align-items: center; justify-content: center; height: 100vh; }
    .box { text-align: center; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #9aa4b2; font-size: 14px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
           background: #ff6b6b; margin-right: 8px; animation: blink 1.2s infinite; }
    @keyframes blink { 50% { opacity: .2; } }
  </style>
</head>
<body>
  <div class="box">
    <h1><svg viewBox="0 0 64 64" width="24" height="24" style="vertical-align: -4px; margin-right: 8px;" aria-hidden="true"><rect width="64" height="64" rx="12" fill="#ffffff"/><path fill-rule="evenodd" fill="#0D5C45" d="M11 5h17.5c15.25 0 22.5 10.5 22.5 27S43.75 59 28.5 59H11V5zm10 11.25v27.5h7.5c8.5 0 11.25-5.5 11.25-13.75S37 16.25 28.5 16.25H21z"/></svg>D-Swarm</h1>
    <p><span class="dot"></span>Starting the command deck…</p>
    <p>Loading <code>http://127.0.0.1:3001</code> — the backend (API :8000) and
       the deck UI (Next.js :3001) are booting.</p>
    <p id="status"></p>
  </div>
  <script>
    // The deck URL: prefer the Wails binding (honors DSWARM_UI_PORT), else :3001.
    function deckUrl() {
      try {
        if (window.go && window.go.main && window.go.main.App) {
          return window.go.main.App.UiPort().then(function (p) {
            return "http://127.0.0.1:" + (p || 3001) + "/";
          });
        }
      } catch (e) {}
      return Promise.resolve("http://127.0.0.1:3001/");
    }
    // Navigate UNCONDITIONALLY once the port is known. A fetch() gate cannot
    // work here: this page runs on the wails:// origin, so a cross-origin
    // fetch to http://127.0.0.1:<port> is CORS-blocked (the Next dev server
    // sends no Access-Control-Allow-Origin) and the "wait until ready" poll
    // never fired — the window sat on this splash forever. The deck's root
    // answers 200 immediately even while compiling, so a short delay is all
    // that's needed.
    deckUrl().then(function (url) {
      setTimeout(function () { location.replace(url); }, 800);
    });
  </script>
</body>
</html>
